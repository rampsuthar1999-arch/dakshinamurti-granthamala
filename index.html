<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>दक्षिणामूर्ति ग्रन्थमाला</title>
<meta name="description" content="श्रीदक्षिणामूर्ति मठ प्रकाशन के ग्रन्थों का डिजिटल पाठ — पञ्चदशी (स्वामी महेशानन्द गिरि जी की व्याख्या सहित)">
<meta name="theme-color" content="#f6efe2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Sanskrit:ital@0;1&family=Noto+Serif+Devanagari:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>
  try { var t = localStorage.getItem('dg.theme'); if (t) document.documentElement.dataset.theme = t;
        var f = localStorage.getItem('dg.font'); if (f) document.documentElement.style.setProperty('--fs', f + 'px'); } catch (e) {}
</script>
</head>
<body>
<header class="topbar" id="topbar">
  <button class="icon-btn" id="btn-back" aria-label="पीछे" hidden>
    <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <button class="icon-btn" id="btn-toc" aria-label="विषय सूची" hidden>
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h11"/></svg>
  </button>
  <a class="brand" href="#/" id="brand">
    <span class="brand-mark">ॐ</span>
    <span class="brand-text" id="bar-title">दक्षिणामूर्ति ग्रन्थमाला</span>
  </a>
  <div class="bar-actions">
    <button class="icon-btn" id="btn-search" aria-label="खोजें">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
    </button>
    <button class="icon-btn" id="btn-split" aria-label="मूल पृष्ठ साथ में" hidden title="मूल पृष्ठ साथ में देखें">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="7" height="15" rx="1"/><rect x="13.5" y="4.5" width="7" height="15" rx="1"/></svg>
    </button>
    <button class="icon-btn" id="btn-bookmarks" aria-label="बुकमार्क">
      <svg viewBox="0 0 24 24"><path d="M7 4h10v16l-5-3.5L7 20z"/></svg>
    </button>
    <button class="icon-btn" id="btn-settings" aria-label="सेटिंग्स">
      <svg viewBox="0 0 24 24"><path d="M5 7h9M18 7h1M5 17h1M10 17h9"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
    </button>
  </div>
  <div class="progress" id="progress"></div>
</header>

<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <strong id="drawer-title">विषय सूची</strong>
    <button class="icon-btn" data-close="drawer" aria-label="बंद करें"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <nav id="drawer-body"></nav>
</aside>

<div class="sheet" id="settings" aria-hidden="true">
  <div class="sheet-card">
    <div class="sheet-head"><strong>पठन सेटिंग्स</strong>
      <button class="icon-btn" data-close="settings" aria-label="बंद करें"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <label class="set-row">अक्षर आकार
      <span class="stepper"><button id="fs-down" aria-label="छोटा">अ−</button><output id="fs-val">19</output><button id="fs-up" aria-label="बड़ा">अ+</button></span>
    </label>
    <div class="set-row">रंग
      <span class="themes">
        <button data-theme-set="light" class="sw sw-light" aria-label="उजला"></button>
        <button data-theme-set="sepia" class="sw sw-sepia" aria-label="सेपिया"></button>
        <button data-theme-set="dark" class="sw sw-dark" aria-label="गहरा"></button>
      </span>
    </div>
    <label class="set-row">केवल श्लोक और अर्थ
      <input type="checkbox" id="verses-only">
    </label>
  </div>
</div>

<main id="app" tabindex="-1"></main>

<div class="pageview" id="pageview" aria-hidden="true">
  <div class="pv-bar">
    <button class="icon-btn" id="pv-prev" aria-label="पिछला पृष्ठ"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span class="pv-label" id="pv-label"></span>
    <button class="icon-btn" id="pv-next" aria-label="अगला पृष्ठ"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <span class="pv-spacer"></span>
    <button class="pv-text" id="pv-totext">पाठ पढ़ें</button>
    <button class="icon-btn" id="pv-close" aria-label="बंद करें"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="pv-scroll" id="pv-scroll"><img id="pv-img" alt="मूल पृष्ठ"></div>
</div>

<div class="toast" id="toast" role="status"></div>
<div class="scrim" id="scrim"></div>

<script src="app.js"></script>
</body>
</html>
